[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "pyinputcapture"
version = "0.2.0"
description = "Python bindings for the XDG InputCapture portal (Wayland cursor capture via ashpd)"
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later" }
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Operating System :: POSIX :: Linux",
    "Topic :: Desktop Environment",
    "Typing :: Typed",
]

[project.optional-dependencies]
# pytest-timeout is not optional in practice: several tests exercise waits that
# are only bounded by the portal being unreachable, and without it a regression
# hangs the run instead of failing.
dev = ["maturin>=1.0,<2.0", "pytest>=8", "pytest-timeout>=2"]

[project.urls]
Repository = "https://github.com/fizzi01/pyinputcapture"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["timeout: per-test wall-clock bound (pytest-timeout)"]

[tool.maturin]
features = ["extension-module"]
python-source = "python"
module-name = "pyinputcapture.pyinputcapture"
include = ["python/pyinputcapture/py.typed", "python/pyinputcapture/*.pyi"]
